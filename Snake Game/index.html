<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section>
            <div class="infos">
                <div class="info">
                    <h1>High Score: 
                        <span id="highScore">0</span>
                    </h1>
                </div>

                <div class="info">
                    <h1>Score: 
                        <span id="score">0</span>
                    </h1>
                </div>

                <div class="info">
                    <h1>Time: 
                        <span id="time">00:00</span>
                    </h1>
                </div>
            </div>
            <div class="board">
            </div>

            <div class="modal">
                <div class="start-game">
                    <h2>Welcome to the Snake Game</h1>
                    <button class="btn">Start Game</button>
                </div>

                <div class="game-over">
                    <h2>Game Over</h1>
                    <button id="restartBtn" class="btn">Restart Game</button>
                </div>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
