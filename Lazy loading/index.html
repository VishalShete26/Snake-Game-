<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lazy Loading</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        background: #1c1c1c;
        color: #ffff;
        font-family: "century gothic";
      }
      html,
      body {
        height: 100vh;
        width: 100%;
      }
      .container{
        max-width: 700px;
        margin: 0 auto;
        padding: 20px;
      }

      .spacer{
        height: 600px;
        /* to force scroll */
      }
      .lazy-img{
        display: block;
        width: 100%;
        height: auto;
        margin: 30px 0;
        opacity: 0;
        transition: opacity 2s ease;
      }
      .lazy-img.loaded{
        opacity: 1;
      }
      h1{
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 200px;
        font-size: 80px;
        text-align: center;
      }
      p{
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
        text-align: center;

      }
    </style>
  </head>
  <body>
    <h1>Lazy Loading image With <br> IntersectionOberver</h1>
    <div class="container">
        <p>Scrol Down to see images load only when they enter the viewport👇 </p>
        <div class="spacer"></div>
        <img data-src="1.jpg" class="lazy-img" alt="image 1">
        <div class="spacer"></div>
        <img data-src="2.jpg" class="lazy-img" alt="image 2">
        <div class="spacer"></div>
        <img data-src="3.jpg" class="lazy-img" alt="image 3">
        <div class="spacer"></div>
        <img data-src="4.jpg" class="lazy-img" alt="image 4">
    </div>

    <script src="script.js"></script>
  </body>
</html>
