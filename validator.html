<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <form class="form" id="form">
            <h3 id="h3">Email & Password Validation</h3>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="text" id="email" placeholder="enter your email">
                <small class="error" id="emailerror">error</small>
            </div>

            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" placeholder="enter password">
                <small class="error" id="passworderror">error</small>
            </div>

            <div class="form-group">
                <label for="confirm">Confirm Password :</label>
                <input type="password" id="confirm" placeholder="confirm password">
                <small class="error" id="confirmerror">error</small>
            </div>
            <button type="submit">log in</button>
        </form>
        <div><h5 id="resultMassage"></h5></div>
    </div>
    <script src="script5.js"></script>
</body>
</html>
