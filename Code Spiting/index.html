<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Spliting</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            background: #101010;
            color: #ffff;
            font-family: "century gothic";
        }
        html,body{
            width: 100%;
            height: 100%;
        }
        .container{
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        h1{
            font-size: 60px;
            text-align: center;
        }
        #btn{
            margin-top: 40px;
            font-size: 26px;
            padding: 10px 20px;
            border: none;
            background: seagreen;
            border-radius: 10px;
            transition: 0.5s ease;
        }
        #btn:hover{
            background: rgb(25, 93, 54);
            transform: translateY(-4px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Code Spiting With <br> Dynamic Import</h1>
        <button id="btn">Click to import heavy module</button>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
