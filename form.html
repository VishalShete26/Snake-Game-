<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0%;
            padding: 0%;
            font-family: "outfit";
            box-sizing: border-box;
        }
        html,body{
            width: 100%;
            height: 100%;
        }
        #main{
            padding: 50px;
            width: 100%;
            height: 100%;
            background-color: #222;
            font-weight: 400;
        }
        input{
            padding: 8px 20px;
            margin: 8px;
            display: block;
            border-radius: 4px;
        }
        .card{
            margin-top: 50px;
            max-width: 300px;
            display: inline-block;
            color: white;
            padding: 20px;
            gap: 20px;
            border-radius: 10px;
            border: 1px solid #555;
        }
        .profile{
            width: 50px;
            height: 50px;
            border-radius: 50px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .profile img{
            width: 100%;
            height: 100%;
            object-fit:cover;
        }

        .card p{
            font-size: 12px;
            margin-top: 10px;
            font-weight: 200;
        }

        .card h5{
            margin-top: 3px;
            font-weight: 500;
        }
        .card h3{
            margin-top: 5px;
        }

    </style>
</head>
<body>
    <div id="main">
        <form action=""> 
        <input type="text" placeholder="profile">
        <input type="text" placeholder="name">
        <input type="text" placeholder="Occupation">
        <input type="text" placeholder="info">
        <input type="submit">
        </form>
    </div>
    <script src="script4.js"></script>
</body>
</html>
