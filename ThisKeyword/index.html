<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Cards</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="frmContainer">
        <h2>Add User</h2>
        <form id="frm">
          <label>Name:</label>
          <input required id="name" type="text" placeholder="enter user name" />

          <label>Role:</label>
          <input required id="role" type="text" placeholder="enter job role" />

          <label>Bio:</label>
          <textarea required id="bio" rows="4"></textarea>

          <label>Photo URL:</label>
          <input required id="photo" type="text" placeholder="https://example.com/photo.jpg" />

          <button type="submit">SUBMIT</button>
        </form>
      </div>
      <div class="cardcontainer">
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
